<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Algebra Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light;background:#5a3a1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;background:#5a3a1c}
#blok{height:100%}
#blok .glang{display:inline-flex;gap:4px;background:#efe2bf;border-radius:999px;padding:3px;margin-bottom:10px}
#blok .glang button{font:inherit;font-size:.85rem;font-weight:600;border:0;background:transparent;color:#3a2a1a;padding:5px 12px;border-radius:999px;cursor:pointer}
#blok .glang button[aria-pressed="true"]{background:#3a2a1a;color:#fbf3dd}
#blok .glang button:focus-visible{outline:3px solid #2b5fa8;outline-offset:1px}
/* game */
#blok{--kertas:#fbf3dd;--tinta:#3a2a1a;--tinta-lembut:#7a6143;--hijau:#2f9e5f;
  font-family:"Fredoka","Baloo 2","Trebuchet MS","Comic Sans MS",system-ui,sans-serif}
#blok .gstage{position:relative;width:100%;height:100%;border-radius:0;overflow:hidden;background:#5a3a1c;color:var(--tinta);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;box-shadow:0 10px 30px rgba(40,20,0,.3)}
#blok canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#blok h1,#blok h2{font-family:inherit;letter-spacing:0;line-height:1.2}
#blok p{max-width:none}
#blok #hud{position:absolute;left:0;right:0;top:0;z-index:2;display:none;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 10px;padding:10px 14px;pointer-events:none}
#blok #hud.on{display:flex}
#blok .pill{background:rgba(48,28,12,.88);color:#fbf3dd;border-radius:16px;padding:6px 14px 7px;display:flex;flex-direction:column;min-width:86px;box-shadow:0 3px 0 rgba(0,0,0,.28)}
#blok .pill .lbl{font-size:.74rem;opacity:.8;line-height:1.1}
#blok .pill b{font-size:1.5rem;line-height:1.1;font-weight:600;font-variant-numeric:tabular-nums}
#blok #pTime{flex:1 1 170px;max-width:360px}
#blok .bar{height:9px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:4px}
#blok .bar i{display:block;height:100%;width:100%;background:#4cb963;border-radius:99px}
#blok #pTime.low .bar i{background:#ee5a47}
#blok #pTime.low b{color:#ffb8ab}
#blok #pGoal.ok b{color:#8ff0a4}
#blok .tools{display:flex;gap:8px;flex-wrap:wrap;pointer-events:auto}
#blok .tbtn{font:inherit;font-size:.9rem;font-weight:500;cursor:pointer;background:var(--kertas);color:var(--tinta);border:0;border-radius:14px;padding:9px 14px;box-shadow:0 3px 0 rgba(0,0,0,.3)}
#blok .tbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
#blok .tbtn:focus-visible,#blok .btn:focus-visible,#blok .lv:focus-visible{outline:3px solid #2b5fa8;outline-offset:2px}
#blok #overlay{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;padding:14px;pointer-events:none}
#blok .card{pointer-events:auto;background:var(--kertas);color:var(--tinta);width:100%;max-width:540px;max-height:100%;overflow:auto;border-radius:26px;padding:24px 26px 26px;text-align:center;box-shadow:0 20px 44px rgba(0,0,0,.5),inset 0 0 0 3px rgba(122,78,39,.22)}
#blok .logo{display:flex;justify-content:center;margin-bottom:8px}
#blok .logo span{display:inline-grid;place-items:center;width:44px;height:44px;margin:0 3px;border-radius:12px;background:var(--c);color:#fff;font-weight:700;font-size:1.5rem;font-style:italic;box-shadow:0 4px 0 rgba(0,0,0,.22);transform:rotate(var(--r));text-shadow:0 2px 0 rgba(0,0,0,.25)}
#blok .card h1{margin:4px 0 6px;font-size:clamp(1.7rem,5vw,2.2rem);font-weight:700}
#blok .card h2{margin:18px 0 0;font-size:1.05rem;font-weight:600;text-align:left}
#blok .lead{margin:0 0 6px;line-height:1.5;color:var(--tinta-lembut);font-size:1rem}
#blok .steps{text-align:left;margin:12px 0 0;padding-left:22px;line-height:1.55;font-size:.95rem}
#blok .lv{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;color:inherit;background:#fff;border:2px solid #e6d7b0;border-radius:18px;padding:10px 14px;margin-top:10px;cursor:pointer;transition:transform .12s ease-out,border-color .12s}
#blok .lv:hover{border-color:#c9a45e;transform:translateY(-1px)}
#blok .lv .dot{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:700;color:#fff;font-size:1.3rem;box-shadow:0 4px 0 rgba(0,0,0,.2)}
#blok .lv .t b{display:block;font-size:1.08rem;font-weight:600}
#blok .lv .t span{display:block;font-size:.86rem;color:var(--tinta-lembut);line-height:1.35}
#blok .stats{display:flex;gap:10px;justify-content:center;margin:16px 0 6px}
#blok .stats div{flex:1;background:#fff;border:2px solid #e6d7b0;border-radius:16px;padding:10px 6px}
#blok .stats b{display:block;font-size:1.9rem;font-weight:700;line-height:1.1}
#blok .stats span{font-size:.85rem;color:var(--tinta-lembut)}
#blok .note{color:var(--tinta-lembut);margin:8px 0 0;font-size:.95rem}
#blok .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
#blok .btn{font:inherit;font-weight:600;font-size:1.05rem;cursor:pointer;color:#fff;background:var(--hijau);border:0;border-radius:999px;padding:12px 26px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
#blok .btn.alt{background:#8a6d45}
#blok .btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
@media (max-width:520px){
  #blok .card{padding:18px 16px 20px}
  #blok .tbtn{padding:8px 11px;font-size:.84rem}
  #blok .pill{min-width:72px;padding:5px 11px 6px}
  #blok .pill b{font-size:1.25rem}
}

@media (prefers-reduced-motion: reduce){#blok .lv{transition:none}}
/* name entry and leaderboard */
#blok .who{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;margin-top:16px;text-align:left}
#blok .who label{font-size:.85rem;font-weight:600;color:var(--tinta-lembut);display:flex;flex-direction:column;gap:4px}
#blok .who input{font:inherit;font-size:1rem;padding:9px 12px;border-radius:12px;border:2px solid #e6d7b0;background:#fff;color:var(--tinta);width:100%;min-width:0}
#blok .who input:focus{outline:none;border-color:var(--hijau)}
#blok .who input.bad{border-color:#d94a38}
#blok .err{color:#c0392b;font-size:.9rem;margin:6px 0 0;text-align:left;min-height:0}
#blok .sbtn{font:inherit;font-weight:600;font-size:.95rem;cursor:pointer;color:var(--tinta);background:#efe2bf;border:0;border-radius:999px;padding:9px 18px;margin-top:14px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
#blok .sbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
#blok .sbtn:focus-visible,#blok .tabs button:focus-visible{outline:3px solid #2b5fa8;outline-offset:2px}
#blok .tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:12px 0 4px}
#blok .tabs button{font:inherit;font-weight:600;font-size:.92rem;border:2px solid #e6d7b0;background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--tinta)}
#blok .tabs button[aria-pressed="true"]{background:var(--tinta);color:var(--kertas);border-color:var(--tinta)}
#blok .lbwrap{background:#fff;border:2px solid #e6d7b0;border-radius:16px;margin-top:10px;overflow:hidden}
#blok .lb{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;text-align:left;font-size:.98rem}
#blok .lb th{font-size:.76rem;color:var(--tinta-lembut);font-weight:600;padding:8px 10px;border-bottom:2px solid #efe4c6;text-transform:uppercase;letter-spacing:.05em}
#blok .lb td{padding:7px 10px;border-bottom:1px solid #f3ead2}
#blok .lb tr:last-child td{border-bottom:0}
#blok .lb .r{width:2.6em;font-weight:700;text-align:center}
#blok .lb .s{text-align:right;font-weight:700}
#blok .lb .n{overflow-wrap:anywhere}
#blok .lb .k{color:var(--tinta-lembut);font-size:.88rem}
#blok .lb tr.me td{background:#e3f5e9}
#blok .medal{display:inline-grid;place-items:center;width:1.7em;height:1.7em;border-radius:50%;color:#fff;font-size:.85rem;box-shadow:0 2px 0 rgba(0,0,0,.18)}
#blok .m1{background:#e0a91b}#blok .m2{background:#9aa3ad}#blok .m3{background:#c27a3e}
#blok .lbstat{font-size:.9rem;color:var(--tinta-lembut);margin:10px 0 0}
#blok .lbstat.okk{color:var(--hijau);font-weight:600}
#blok .lbstat.upd{display:flex;align-items:center;gap:7px;color:#8a6d45;font-weight:600}
#blok .lbstat.upd::before{content:"";flex:none;width:.95em;height:.95em;border-radius:50%;border:2.5px solid #e6d7b0;border-top-color:#2f9e5f;animation:lbspin .8s linear infinite}
#blok .lbstat.warn{color:#b5542b}
#blok .lbwrap.stale{opacity:.72}
#blok .lbwrap.fresh{animation:lbfresh .9s ease-out}
@keyframes lbspin{to{transform:rotate(360deg)}}
@keyframes lbfresh{0%{box-shadow:0 0 0 4px rgba(47,158,95,.55)}100%{box-shadow:0 0 0 0 rgba(47,158,95,0)}}
@media (prefers-reduced-motion: reduce){#blok .lbstat.upd::before{animation:none}#blok .lbwrap.fresh{animation:none}}
#blok .rank{font-weight:600;color:var(--tinta);margin:12px 0 0}
/* side leaderboard on the main menu */
#blok #overlay{gap:16px;flex-wrap:wrap;align-content:center;overflow:auto}
#blok #overlay.menu #sStart{flex:1 1 440px;max-width:540px}
#blok #sSide{flex:1 1 300px;max-width:380px;text-align:left;padding:20px 18px 18px}
#blok #sSide h1{font-size:1.45rem;margin:0;text-align:center}
#blok #sSide .tabs button{padding:5px 11px;font-size:.85rem}
#blok #sSide .lb .k{display:none}
#blok #sSide .lb td{padding:6px 8px}
#blok .trophy{display:block;text-align:center;font-size:.8rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#c9971c;margin-bottom:2px}
#blok .side-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
#blok .side-foot .lbstat{margin:0;font-size:.8rem}
#blok .side-foot .sbtn{margin:0;padding:6px 12px;font-size:.82rem;flex:none}
@media (max-width:900px){
  #blok #overlay.menu{align-content:flex-start;pointer-events:auto}
  #blok #overlay.menu .card{max-height:none}
  #blok #sSide{max-width:540px}
}
@media (max-width:520px){#blok .who{grid-template-columns:1fr}#blok .lb .k{display:none}}
</style>
</head>
<body>
<div id="blok">
      <div class="gstage" id="gstage">
        <canvas id="c"></canvas>
        <div id="hud">
          <div class="pill" id="pScore"><span class="lbl" data-g="score"></span><b id="hScore">0</b></div>
          <div class="pill" id="pTime"><span class="lbl" data-g="time"></span><b id="hTime">1:30</b><div class="bar"><i id="hBar"></i></div></div>
          <div class="pill" id="pGoal"><span class="lbl" data-g="goal"></span><b id="hGoal">0 / 6</b></div>
          <div class="tools">
            <button class="tbtn" id="bSkip" type="button" data-g="skip"></button>
            <button class="tbtn" id="bPause" type="button" data-g="pause"></button>
            <button class="tbtn" id="bMute" type="button" aria-pressed="false"></button>
          </div>
        </div>
        <div id="overlay">
          <section class="card" id="sStart">
            <div class="glang" role="group" aria-label="Bahasa / Language"><button type="button" data-l="ms">Bahasa Melayu</button><button type="button" data-l="en">English</button></div>
            <div class="logo" aria-hidden="true">
              <span style="--c:#e8453c;--r:-6deg">x</span>
              <span style="--c:#f59a23;--r:4deg;font-style:normal">3</span>
              <span style="--c:#3b8fe0;--r:-3deg">y</span>
              <span style="--c:#4cb963;--r:6deg;font-style:normal">7</span>
              <span style="--c:#8e5bd0;--r:-5deg">k</span>
            </div>
            <h1 data-g="title"></h1>
            <p class="lead" data-g="glead"></p>
            <ol class="steps"><li data-g="s1"></li><li data-g="s2"></li><li data-g="s3"></li></ol>
            <div class="who">
              <label for="pName"><span data-g="name"></span><input id="pName" type="text" maxlength="20" autocomplete="off" spellcheck="false"></label>
              <label for="pClass"><span data-g="kelas"></span><input id="pClass" type="text" maxlength="12" autocomplete="off" spellcheck="false"></label>
            </div>
            <p class="err" id="pErr" role="alert" hidden></p>
            <h2 data-g="choose"></h2>
            <button class="lv" type="button" data-lv="1"><span class="dot" style="background:#3fae6a">1</span><span class="t"><b data-g="l1"></b><span data-g="l1d"></span></span></button>
            <button class="lv" type="button" data-lv="2"><span class="dot" style="background:#f08a24">2</span><span class="t"><b data-g="l2"></b><span data-g="l2d"></span></span></button>
            <button class="lv" type="button" data-lv="3"><span class="dot" style="background:#7e57c2">3</span><span class="t"><b data-g="l3"></b><span data-g="l3d"></span></span></button>
          </section>
          <section class="card" id="sSide" aria-labelledby="sideTitle">
            <span class="trophy" aria-hidden="true">★ Top 10 ★</span>
            <h1 id="sideTitle" data-g="board"></h1>
            <div class="tabs" id="sideTabs" role="group">
              <button type="button" data-lv="1"></button><button type="button" data-lv="2"></button><button type="button" data-lv="3"></button>
            </div>
            <div class="lbwrap" id="sideList" hidden></div>
            <div class="side-foot">
              <p class="lbstat" id="sideStat"></p>
              <button class="sbtn" type="button" id="bSideRefresh" data-g="refresh"></button>
            </div>
          </section>
          <section class="card" id="sBoard" hidden>
            <h1 data-g="board"></h1>
            <div class="tabs" id="lbTabs" role="group">
              <button type="button" data-lv="1"></button><button type="button" data-lv="2"></button><button type="button" data-lv="3"></button>
            </div>
            <div class="lbwrap" id="lbList"></div>
            <p class="lbstat" id="lbStat"></p>
            <div class="row"><button class="btn alt" id="bBack" type="button" data-g="back"></button></div>
          </section>
          <section class="card" id="sPause" hidden>
            <h1 data-g="paused"></h1>
            <p class="lead" data-g="pausedS"></p>
            <div class="row">
              <button class="btn" id="bResume" type="button" data-g="resume"></button>
              <button class="btn alt" id="bQuit" type="button" data-g="menu"></button>
            </div>
          </section>
          <section class="card" id="sResult" hidden>
            <h1 id="rTitle"></h1>
            <p class="lead" id="rSub"></p>
            <div class="stats">
              <div><b id="rScore">0</b><span data-g="score"></span></div>
              <div><b id="rOk">0</b><span data-g="ok"></span></div>
              <div><b id="rBad">0</b><span data-g="bad"></span></div>
            </div>
            <p class="note" id="rBest"></p>
            <p class="rank" id="rRank" hidden></p>
            <div class="lbwrap" id="rList" hidden></div>
            <p class="lbstat" id="rStat"></p>
            <div class="row">
              <button class="btn" id="bAgain" type="button" data-g="again"></button>
              <button class="btn alt" id="bMenu" type="button" data-g="change"></button>
            </div>
            <button class="sbtn" type="button" id="bBoard2" data-g="boardBtn"></button>
          </section>
        </div>
      </div>
    </div>

      if (Math.abs(lx) <= hh && Math.abs(ly) <= hh) return b;
    }
    return null;
  }
  canvas.addEventListener('pointerdown', (e) => {
    initAudio();
    if (state === 'paused') return;
    if (state === 'play' && phase !== 'ask') return;
    const p = pos(e), b = hitBlock(p.x, p.y);
    if (!b) return;
    if (b.slot >= 0) { if (slots[b.slot]) slots[b.slot].block = null; b.slot = -1; }
    blocks.splice(blocks.indexOf(b), 1); blocks.push(b);
    b.held = true;
    drag = { b: b, ox: p.x - b.x, oy: p.y - b.y, px: p.x, py: p.y, id: e.pointerId };
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    canvas.style.cursor = 'grabbing';
    sfx('pick');
    e.preventDefault();
  });
  canvas.addEventListener('pointermove', (e) => {
    const p = pos(e);
    if (drag && e.pointerId === drag.id) { drag.px = p.x; drag.py = p.y; return; }
    canvas.style.cursor = hitBlock(p.x, p.y) ? 'grab' : 'default';
  });
  function endDrag(e) {
    if (!drag || (e && e.pointerId !== drag.id)) return;
    const b = drag.b; b.held = false; drag = null;
    if (state === 'play' && phase === 'ask') dropBlock(b); else sfx('drop');
    canvas.style.cursor = 'grab';
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  const screens = ['sStart', 'sPause', 'sResult', 'sBoard'];
  function showScreen(id) {
    screens.forEach((s) => { $(s).hidden = (s !== id); });
    $('sSide').hidden = id !== 'sStart';
    $('overlay').classList.toggle('menu', id === 'sStart');
    $('overlay').hidden = !id;
    if (id === 'sStart') { $('overlay').scrollTop = 0; loadSide(sideLevel); }
  }
  function releaseDrag() { if (drag) { drag.b.held = false; drag = null; } }

  function startGame(lv) {
    initAudio();
    level = lv; cfg = LEVELS[lv];
    score = 0; solved = 0; wrongN = 0; streak = 0; qNo = 0; goalHit = false; lastTick = -1; lastGen = null;
    timeLeft = cfg.masa;
    parts = []; floats = []; slots = []; q = null; layoutInfo = null; lastResult = null; rState = null;
    releaseDrag();
    state = 'play'; phase = 'ask';
    hud.classList.add('on');
    showScreen(null);
    measureHud();
    hudCache = {};
    nextQuestion();
    updateHud(true);
  }
  function renderResult() {
    if (!lastResult) return;
    const r = lastResult;
    $('rTitle').textContent = r.win ? g('win') : (r.solved >= Math.ceil(r.goal * 0.6) ? g('near') : g('over'));
    $('rSub').textContent = g('sub')(r.solved, r.goal) + (r.win ? '' : g('subMore'));
    $('rScore').textContent = r.score; $('rOk').textContent = r.solved; $('rBad').textContent = r.wrong;
    $('rBest').textContent = r.record ? g('rec')(r.best) : g('best')(r.best);
  }
  function endGame() {
    releaseDrag();
    state = 'over'; phase = 'ask';
    slots.forEach((s) => { if (s.block) { ejectBlock(s.block); s.block = null; } });
    const win = solved >= cfg.sasaran;
    let record = false;
    if (score > best[level]) {
      record = score > 0; best[level] = score;
      try { localStorage.setItem('blok-algebra-rekod-v1', JSON.stringify(best)); } catch (e) {}
    }
    lastResult = { win: win, solved: solved, goal: cfg.sasaran, score: score, wrong: wrongN, record: record, best: best[level] };
    renderResult();
    submitResult();
    hud.classList.remove('on');
    measureHud();
    showScreen('sResult');
    if (win) { sfx('win'); for (let i = 0; i < 5; i++) burst(W * (0.15 + i * 0.175), H * 0.3, 40); }
    else sfx('lose');
  }
  /* ---- leaderboard flow ---- */
  let rState = null;   // { status, rows }
  function renderResultBoard() {
    const st = $('rStat'), list = $('rList'), rk = $('rRank');
    if (!rState) { st.textContent = ''; list.hidden = true; rk.hidden = true; return; }
    st.className = 'lbstat' + (rState.status === 'sending' ? ' upd' : rState.status === 'sent' || rState.status === 'local' ? ' okk' : ' warn');
    st.textContent = rState.status === 'sending' ? g('sending') : rState.status === 'sent' ? g('sent') : rState.status === 'local' ? g('sentLocal') : g('sendErr');
    if (rState.rows) {
      const me = pkey(player.name, player.kelas);
      list.classList.toggle('stale', !!rState.updating);
      if (rState.updating) { rk.hidden = true; list.innerHTML = tableHTML(rState.rows, me, 5); list.hidden = false; return; }
      const pos = rState.rows.findIndex((r) => pkey(r.name, r.kelas) === me);
      rk.hidden = pos < 0;
      if (pos >= 0) rk.textContent = g('rankMsg')(pos + 1, rState.level);
      list.innerHTML = tableHTML(rState.rows, me, 5);
      list.hidden = false;
    } else { list.hidden = true; rk.hidden = true; }
  }
  async function submitResult() {
    const lv = level;
    const entry = { name: player.name, kelas: player.kelas, level: lv, score: score, solved: solved, wrong: wrongN, time: Date.now() };
    rState = { status: 'sending', rows: LB.shared ? LB.cached(lv) : null, level: lv, updating: LB.shared };
    renderResultBoard();
    const status = await LB.submit(entry);
    if (!rState || rState.level !== lv) return;
    rState.status = status;
    try { rState.rows = await LB.top(lv); } catch (e) { /* keep the older rows */ }
    rState.updating = false;
    if (state === 'over') renderResultBoard();
  }
  let boardLevel = 1, boardFrom = 'sStart', boardRows = null, boardMode = 'updating', boardReq = 0;
  function renderBoard() {
    document.querySelectorAll('#lbTabs button').forEach((b) => {
      b.textContent = g('lv')(+b.dataset.lv);
      b.setAttribute('aria-pressed', String(+b.dataset.lv === boardLevel));
    });
    $('lbTabs').setAttribute('aria-label', g('board'));
    paintBoard($('lbList'), $('lbStat'), boardRows, boardMode, pkey(player.name, player.kelas), 20,
      LB.shared ? g('onlineNote') : g('localNote'));
  }
  async function loadBoard(lv) {
    boardLevel = lv; boardRows = LB.cached(lv);
    const req = ++boardReq;
    boardMode = LB.shared ? 'updating' : 'ok';
    renderBoard();
    if (!LB.shared) return;
    try { const rows = await LB.top(lv); if (req !== boardReq) return; boardRows = rows; boardMode = 'ok'; }
    catch (e) { if (req !== boardReq) return; boardMode = boardRows ? 'stale' : 'error'; }
    renderBoard();
  }
  function openBoard(from) {
    boardFrom = from;
    showScreen('sBoard');
    loadBoard(from === 'sResult' ? level : boardLevel);
  }
  function readPlayer() {
    const n = cleanTxt($('pName').value, 20), k = cleanTxt($('pClass').value, 12);
    if (!n) {
      $('pErr').textContent = g('needName'); $('pErr').hidden = false;
      $('pName').classList.add('bad'); $('pName').focus();
      return false;
    }
    player = { name: n, kelas: k };
    try { localStorage.setItem('blok-algebra-pemain-v1', JSON.stringify(player)); } catch (e) {}
    $('pErr').hidden = true; $('pName').classList.remove('bad');
    return true;
  }

  /* ---- side leaderboard on the main menu ---- */
  let sideLevel = 1, sideRows = null, sideMode = 'updating', sideReq = 0;
  function renderSide() {
    document.querySelectorAll('#sideTabs button').forEach((b) => {
      b.textContent = g('lv')(+b.dataset.lv);
      b.setAttribute('aria-pressed', String(+b.dataset.lv === sideLevel));
    });
    $('sideTabs').setAttribute('aria-label', g('board'));
    paintBoard($('sideList'), $('sideStat'), sideRows, sideMode, player.name ? pkey(player.name, player.kelas) : '', 10,
      LB.shared ? g('onlineShort') : g('localShort'));
  }
  async function loadSide(lv) {
    if (lv !== sideLevel || !sideRows) sideRows = LB.cached(lv);
    sideLevel = lv;
    const req = ++sideReq;
    sideMode = LB.shared ? 'updating' : 'ok';
    renderSide();
    if (!LB.shared) return;
    try { const rows = await LB.top(lv); if (req !== sideReq) return; sideRows = rows; sideMode = 'ok'; }
    catch (e) { if (req !== sideReq) return; sideMode = sideRows ? 'stale' : 'error'; }
    renderSide();
  }
  setInterval(() => { if (state === 'menu' && LB.shared && !document.hidden) loadSide(sideLevel); }, 30000);

  function toMenu() {
    releaseDrag();
    state = 'menu'; phase = 'ask'; q = null; slots = []; layoutInfo = null;
    hud.classList.remove('on'); measureHud();
    showScreen('sStart');
    spawnDecor();
  }
  function pauseGame() { if (state !== 'play') return; releaseDrag(); state = 'paused'; showScreen('sPause'); }
  function resumeGame() { if (state !== 'paused') return; state = 'play'; showScreen(null); }

  document.querySelectorAll('#blok .lv').forEach((b) => b.addEventListener('click', () => { if (readPlayer()) startGame(parseInt(b.getAttribute('data-lv'), 10)); }));
  $('pName').value = player.name; $('pClass').value = player.kelas;
  $('pName').addEventListener('input', () => { if ($('pName').value.trim()) { $('pErr').hidden = true; $('pName').classList.remove('bad'); } });
  document.querySelectorAll('#sideTabs button').forEach((b) => b.addEventListener('click', () => loadSide(+b.dataset.lv)));
  $('bSideRefresh').addEventListener('click', () => loadSide(sideLevel));
  $('bBoard2').addEventListener('click', () => openBoard('sResult'));
  $('bBack').addEventListener('click', () => showScreen(boardFrom));
  document.querySelectorAll('#lbTabs button').forEach((b) => b.addEventListener('click', () => loadBoard(+b.dataset.lv)));
  $('bAgain').addEventListener('click', () => startGame(level));
  $('bMenu').addEventListener('click', toMenu);
  $('bPause').addEventListener('click', pauseGame);
  $('bResume').addEventListener('click', resumeGame);
  $('bQuit').addEventListener('click', toMenu);
  $('bSkip').addEventListener('click', () => {
    if (state !== 'play' || phase !== 'ask') return;
    timeLeft = Math.max(0, timeLeft - 5);
    streak = 0;
    addFloat(g('skipped'), '#ffffff');
    nextQuestion();
    updateHud(true);
  });
  function setMuteLabel() { $('bMute').textContent = muted ? g('soundOff') : g('soundOn'); $('bMute').setAttribute('aria-pressed', String(muted)); }
  $('bMute').addEventListener('click', () => { muted = !muted; setMuteLabel(); });
  window.addEventListener('keydown', (e) => {
    if (e.target && e.target.tagName === 'INPUT') return;
    if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
      if (state === 'play') pauseGame(); else if (state === 'paused') resumeGame();
    }
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });

  function applyGameLang() {
    document.querySelectorAll('#blok [data-g]').forEach((el) => { el.textContent = g(el.dataset.g); });
    document.documentElement.lang = LANG;
    document.querySelectorAll('#blok .glang button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.l === LANG)));
    canvas.setAttribute('aria-label', g('aria'));
    setMuteLabel();
    renderResult();
    renderResultBoard();
    renderBoard();
    renderSide();
    $('pName').placeholder = g('namePh'); $('pClass').placeholder = g('kelasPh');
    if (!$('pErr').hidden) $('pErr').textContent = g('needName');
    if (q && state !== 'menu') layoutQuestion();
  }
  document.querySelectorAll('#blok .glang button').forEach((b) => b.addEventListener('click', () => {
    LANG = b.dataset.l;
    try { localStorage.setItem('gxa-lang', LANG); } catch (e) {}
    applyGameLang();
  }));

  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    if (visible || state === 'play') { update(dt); draw(); }
    requestAnimationFrame(frame);
  }
  resize();
  spawnDecor();
  showScreen('sStart');
  applyGameLang();
  requestAnimationFrame(frame);
  if (document.fonts && document.fonts.load) {
    Promise.all([document.fonts.load('600 40px Fredoka'), document.fonts.load('italic 700 40px Fredoka')])
      .then(() => { if (q) layoutQuestion(); }).catch(() => {});
  }
})();
</script>
</body>
</html>
